name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

# A tag v<version>, which `scripts/release.sh tag` pushes with its commit,
# is a release: this builds the companion APK (Pinky for Android, one APK
# with Pinky's core, built with the runner's Android NDK), Pinky for Windows and Linux
# (Ubuntu, with the FFmpeg and adb that scripts/ffmpeg.sh and
# scripts/adb.sh build in containers) and Pinky.app for Apple silicon and
# Intel (macOS: signed with the Developer ID, both disk images notarized at
# once, the tickets stapled), checks that the Linux and Windows packages'
# FFmpeg decodes and that every package's adb runs a server (on Ubuntu,
# GitHub's Windows runner and macOS), then publishes the GitHub release,
# latest.json last. The steps are the scripts at the tag: scripts/dist.sh
# builds, scripts/publish.sh publishes. The Homebrew tap takes the cask
# that the release carries. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release again (v2026.1107.1)
        required: true
      publish:
        description: Publish it (off builds the branch this runs on, as the tag's version, and keeps the files as this run's artifacts)
        type: boolean
        default: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  TAG: ${{ inputs.tag || github.ref_name }}
  # What the jobs build: the tag, or, in a run by hand that publishes
  # nothing, the commit it runs on, to try a branch as a release.
  REF: ${{ (github.event_name == 'workflow_dispatch' && !inputs.publish) && github.sha || format('refs/tags/{0}', inputs.tag || github.ref_name) }}

jobs:
  companion:
    name: Companion APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
          fetch-depth: 0 # the companion's versionCode counts commits
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag
        run: go run ./scripts/release newer "${TAG#v}"
      - name: Check its notes
        # A run that publishes nothing may build a branch whose CHANGELOG.md
        # does not have the tag's notes yet.
        if: github.event_name == 'push' || inputs.publish
        run: go run ./scripts/release notes "${TAG#v}" > /dev/null
      - name: Download Gradle
        # services.gradle.org sends the wrapper on to GitHub's release
        # downloads, which stalled or answered 504 in Release v2026.1109.11
        # and v2026.1109.13. When the wrapper cannot fetch its Gradle, fetch
        # the same file through GitHub's API into the folder the wrapper
        # keeps it in (named by the base-36 MD5 of distributionUrl); the
        # wrapper still checks it against distributionSha256Sum.
        working-directory: android/companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --version > /dev/null && exit 0
          url=$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | sed 's/\\:/:/g')
          zip=${url##*/}
          name=${zip%.zip}
          version=${name#gradle-}
          version=${version%-bin}
          hash=$(python3 - "$url" <<'EOF'
          import hashlib, sys
          n = int.from_bytes(hashlib.md5(sys.argv[1].encode()).digest(), "big")
          s = ""
          while n:
              n, r = divmod(n, 36)
              s = "0123456789abcdefghijklmnopqrstuvwxyz"[r] + s
          print(s)
          EOF
          )
          dir=$HOME/.gradle/wrapper/dists/$name/$hash
          mkdir -p "$dir"
          for try in 1 2 3; do
            gh release download "v$version" --repo gradle/gradle-distributions --pattern "$zip" --dir "$dir" --clobber && break
            [ "$try" = 3 ] && exit 1
            sleep 30
          done
          ./gradlew --version > /dev/null
      - name: Build
        # Signed with Pinky's release key, which only these secrets hold:
        # Android installs an update of the app only when it is signed with
        # the installed one's key (docs/RELEASING.md). The keystore is on
        # the runner only while the build runs.
        env:
          STRICT: "1"
          COMPANION_KEYSTORE: ${{ secrets.COMPANION_KEYSTORE }}
          PINKY_COMPANION_KEYSTORE_PASSWORD: ${{ secrets.COMPANION_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$COMPANION_KEYSTORE" ] || [ -z "$PINKY_COMPANION_KEYSTORE_PASSWORD" ]; then
            echo "::error::The secrets COMPANION_KEYSTORE (the companion's release keystore, base64) and COMPANION_KEYSTORE_PASSWORD are not set; see docs/RELEASING.md"
            exit 1
          fi
          export PINKY_COMPANION_KEYSTORE="$RUNNER_TEMP/companion-release.p12"
          trap 'rm -f "$PINKY_COMPANION_KEYSTORE"' EXIT
          (umask 077 && printf '%s' "$COMPANION_KEYSTORE" | base64 --decode > "$PINKY_COMPANION_KEYSTORE")
          go run ./scripts/release stamp "${TAG#v}"
          scripts/dist.sh companion "$RUNNER_TEMP/companion"
          # The certificate the release is signed with, for the log: the
          # same in every release, or installed Companions cannot update.
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$RUNNER_TEMP/companion/pinky-android.apk" 2>/dev/null | grep -E 'DN|SHA-256' || true
      - uses: actions/upload-artifact@v7
        with:
          name: companion
          path: ${{ runner.temp }}/companion/pinky-android.apk
          if-no-files-found: error
          retention-days: 3

  linux-windows:
    name: Linux and Windows
    needs: companion
    runs-on: ubuntu-latest
    # FFmpeg and adb for both, when the cache has none, take about 20.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installer, and ffmpeg, which makes the test streams
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nsis ffmpeg >/dev/null
      - name: Cache FFmpeg
        uses: actions/cache@v6
        with:
          path: build/ffmpeg-dist
          key: ffmpeg-windows-linux-${{ hashFiles('scripts/ffmpeg.sh') }}
      - name: Cache adb
        uses: actions/cache@v6
        with:
          path: build/adb-dist
          key: adb-windows-linux-${{ hashFiles('scripts/adb.sh', 'scripts/adb/**') }}
      - uses: actions/download-artifact@v8
        with:
          name: companion
          path: ${{ runner.temp }}/companion
      - name: Build
        env:
          STRICT: "1"
          COMPANION_APK: ${{ runner.temp }}/companion/pinky-android.apk
          GH_TOKEN: ${{ github.token }} # scripts/adb.sh, when github.com's release downloads fail
        run: |
          go run ./scripts/release stamp "${TAG#v}"
          scripts/dist.sh windows "$RUNNER_TEMP/dist"
          scripts/dist.sh linux "$RUNNER_TEMP/dist"
      - name: Check that the Linux package's FFmpeg decodes
        run: |
          dir="$RUNNER_TEMP/linux-package"
          mkdir -p "$dir"
          tar -xzf "$RUNNER_TEMP/dist/pinky-${TAG#v}-linux-amd64.tar.gz" -C "$dir"
          PINKY_FFMPEG_APP="$dir" go test -count=1 -run TestPackagedFFmpeg -v ./internal/video/ | grep -E -e '--- |^(ok|FAIL)|video_test.go'
      - name: Check that the Linux package's adb runs a server
        run: |
          PINKY_ADB_APP="$RUNNER_TEMP/linux-package" go test -count=1 -run TestPackagedADB -v ./internal/driver/android/adb/ | grep -E -e '--- |^(ok|FAIL)|packaged_test.go'
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows package
    needs: linux-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: linux-windows
          path: ${{ runner.temp }}/dist
      - name: Download an ffmpeg command for the test streams
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A static build, so that no other FFmpeg DLLs are around. Through
          # GitHub's API (gh), as in ci.yml, since the releases' download
          # links have answered 504 for hours at a time. For up to ten
          # minutes: FFmpeg-Builds deletes its latest release and makes it
          # again with each new build, so it is missing while some 5 GB of
          # builds upload, a few minutes.
          for try in {1..20}; do
            gh release download latest --repo FFmpeg-Builds/FFmpeg-Builds --pattern ffmpeg-n9.0-latest-win64-gpl-9.0.zip --dir "$RUNNER_TEMP" --clobber && exit 0
            sleep 30
          done
          exit 1
      - name: Unpack the Windows zip and the ffmpeg command
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $version = $env:TAG.TrimStart('v')
          Expand-Archive "$env:RUNNER_TEMP\dist\pinky-$version-windows-amd64.zip" -DestinationPath "$env:RUNNER_TEMP\windows-package"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg-n9.0-latest-win64-gpl-9.0.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName + "\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Get-ChildItem "$env:RUNNER_TEMP\windows-package"
      - name: Check that the Windows package's FFmpeg decodes
        shell: bash
        run: |
          PINKY_FFMPEG_APP="$RUNNER_TEMP\windows-package" go test -count=1 -run TestPackagedFFmpeg -v ./internal/video/ | grep -E -e '--- |^(ok|FAIL)|video_test.go'
      - name: Check that the Windows package's adb runs a server
        shell: bash
        run: |
          PINKY_ADB_APP="$RUNNER_TEMP\windows-package" go test -count=1 -run TestPackagedADB -v ./internal/driver/android/adb/ | grep -E -e '--- |^(ok|FAIL)|packaged_test.go'

  macos:
    name: macOS
    needs: companion
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v6
        with:
          path: build/ffmpeg-dist
          key: ffmpeg-macos-${{ hashFiles('scripts/ffmpeg.sh') }}
      - name: Install nasm, for FFmpeg's Intel assembly
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: brew install --quiet nasm
      - name: Cache adb
        id: adb
        uses: actions/cache@v6
        with:
          path: build/adb-dist
          key: adb-macos-${{ hashFiles('scripts/adb.sh', 'scripts/adb/**') }}
      - name: Install CMake, for adb
        if: steps.adb.outputs.cache-hit != 'true'
        run: command -v cmake >/dev/null || brew install --quiet cmake
      - name: Put the Developer ID and the notary's credentials in a keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::error::The secret MACOS_CERTIFICATE (the Developer ID Application certificate as a base64 .p12) is not set; see docs/RELEASING.md, or publish from the Mac with scripts/release.sh publish $TAG"
            exit 1
          fi
          keychain="$RUNNER_TEMP/pinky-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          if [ -n "$NOTARY_API_KEY" ]; then
            printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
            xcrun notarytool store-credentials pinky-notary --keychain "$keychain" \
              --key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER" >/dev/null
          elif [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials pinky-notary --keychain "$keychain" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" >/dev/null
          else
            echo "::error::Neither NOTARY_API_KEY (an App Store Connect API key) nor APPLE_ID is set, so nothing can notarize; see docs/RELEASING.md"
            exit 1
          fi
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: companion
          path: ${{ runner.temp }}/companion
      - name: Build, sign and notarize
        env:
          STRICT: "1"
          COMPANION_APK: ${{ runner.temp }}/companion/pinky-android.apk
          SIGN: ${{ vars.MACOS_SIGN_IDENTITY }}
          GH_TOKEN: ${{ github.token }} # scripts/adb.sh, when github.com's release downloads fail
        run: |
          go run ./scripts/release stamp "${TAG#v}"
          scripts/dist.sh darwin "$RUNNER_TEMP/dist"
      # The iPhone app kit, from which desktop Pinky builds Pinky's iPhone
      # app with the person's team to host WebDriverAgent
      # (internal/driver/ios/appinstall.go).
      - name: Pack the iPhone app kit
        run: |
          command -v xcodegen >/dev/null || brew install --quiet xcodegen
          ios/build.sh kit "$RUNNER_TEMP/dist/pinky-iphone-${TAG#v}.tar.gz" "${TAG#v}"
      - name: Check that the apps' adb runs a server
        run: |
          for arch in arm64 amd64; do
            if [ "$arch" = amd64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "No Rosetta on this runner: the Intel app's adb was checked for its processor only"
              continue
            fi
            dir="$RUNNER_TEMP/check-adb-$arch"
            ditto -x -k "$RUNNER_TEMP/dist/pinky-${TAG#v}-darwin-$arch.zip" "$dir"
            PINKY_ADB_APP="$dir/Pinky.app" go test -count=1 -run TestPackagedADB -v ./internal/driver/android/adb/ | grep -E -e '--- |^(ok|FAIL)|packaged_test.go'
          done
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 3
      - name: Remove the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/pinky-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8"

  publish:
    name: Publish
    needs: [linux-windows, windows, macos]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: linux-windows
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: ${{ runner.temp }}/dist
      # Pinky for Android on its own too: the feed's android-arm64, which the
      # app updates itself from, and a download that needs no computer.
      - uses: actions/download-artifact@v8
        with:
          name: companion
          path: ${{ runner.temp }}/dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_REPO: ${{ github.repository }}
        run: |
          go run ./scripts/release mcpb -version "${TAG#v}" -out "$RUNNER_TEMP/dist/pinky-${TAG#v}.mcpb"
          go run ./scripts/release manifest -dir "$RUNNER_TEMP/dist" -version "${TAG#v}" -repo "$RELEASES_REPO"
          ls -l "$RUNNER_TEMP/dist"
          scripts/publish.sh "$RUNNER_TEMP/dist"
