# XcodeGen spec for Pinky's iPhone app; ../build.sh generates the project
# (never committed) and builds it.
name: Pinky
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # English, Simplified Chinese and Japanese, as desktop Pinky: the words
  # are in Shared/Localizable.xcstrings and App/InfoPlist.xcstrings.
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 492J8Q67PF
    # The app's bundle id; the tunnel and the Live Activity add .tunnel
    # and .activity. Whoever builds chooses it (build.sh: PINKY_BUNDLE_ID),
    # since an App ID belongs to one team. The app reads every other name
    # from it (Shared/Pinky.swift).
    PINKY_BUNDLE_ID: cc.diygod.pinky.standalone
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    # One binary per part: build.sh signs the bundles, not a split-off
    # debug dylib, which iOS would refuse to load unsigned.
    ENABLE_DEBUG_DYLIB: NO

targetTemplates:
  # Links the Go core (build/core/libpinkycore.a).
  Core:
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridging.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/build/core
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/core
        OTHER_LDFLAGS: -lpinkycore -lresolv -framework Security -framework CoreFoundation
  AppBase:
    type: application
    platform: iOS
    templates: [Core]
    settings:
      base:
        # App/Assets.xcassets: the home screen icon (assets/icon/pinky-ios-1024.png)
        # and the mark beside the title (PinkyMark, the same picture).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Where the Developer Disk Image puts XCTest, for the app hosting
        # WebDriverAgent's test (App/TestHost.swift, build.sh: PINKY_WDA),
        # as Xcode's XCTRunner.app has them.
        LD_RUNPATH_SEARCH_PATHS: >-
          $(inherited) @executable_path/Frameworks
          /System/Developer/Library/Frameworks /System/Developer/usr/lib
          /Developer/Library/Frameworks /Developer/usr/lib
    sources:
      # App/ModelServices.json, the services Settings offers (generated by
      # `go generate ./internal/pilot`), goes in as a resource with it.
      - App
      - path: Shared
        excludes: ["*.h"]
      - Activity/PinkyActivity.swift
      - Activity/Palette.swift
      - path: build/Pairing.json
        buildPhase: resources
  ActivityBase:
    type: app-extension
    platform: iOS
    sources:
      - Activity
      - Shared/Pinky.swift
      - Shared/Localizable.xcstrings
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION

targets:
  # The app with its own packet tunnel, where the core runs while other
  # apps are in front. Needs a paid team: a personal team cannot sign the
  # Network Extension capability.
  Pinky:
    templates: [AppBase]
    dependencies:
      - target: PinkyTunnel
      - target: PinkyActivity
    info:
      path: build/gen/App-Info.plist
      properties: &appInfo
        CFBundleDisplayName: Pinky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        NSFaceIDUsageDescription: Pinky asks for Face ID before it goes ahead with a step you approve.
        # Voice input in the task box (App/Dictation.swift).
        NSSpeechRecognitionUsageDescription: Pinky turns what you say into the task you give it, on this iPhone when it can.
        NSMicrophoneUsageDescription: Pinky listens while you speak a task, after you tap the microphone.
        # remotepairingd's advertisement on the loopback interface gives the
        # port the core dials (PairingPort.swift); on iOS 27 the app
        # advertises itself as a host the phone may pair with
        # (PhonePairing.swift).
        NSLocalNetworkUsageDescription: Pinky pairs with this iPhone and looks for its own pairing service to control your apps.
        NSBonjourServices: [_remotepairing._tcp, _remotepairing-pairable-host._tcp]
    # build.sh signs each part with build/gen/<target>.entitlements.
    entitlements:
      path: build/gen/Pinky.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PINKY_BUNDLE_ID)

  PinkyTunnel:
    type: app-extension
    platform: iOS
    templates: [Core]
    sources:
      - Tunnel
      - path: Shared
        excludes: ["*.h"]
    info:
      path: build/gen/Tunnel-Info.plist
      properties:
        CFBundleDisplayName: Pinky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: build/gen/PinkyTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PINKY_BUNDLE_ID).tunnel

  PinkyActivity:
    templates: [ActivityBase]
    info:
      path: build/gen/Activity-Info.plist
      properties: &activityInfo
        CFBundleDisplayName: Pinky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PINKY_BUNDLE_ID).activity

  # Without a tunnel of its own, for a personal team: LocalDevVPN reflects
  # the packets and the core runs in the app, which background audio keeps
  # running during a task. Under the owner's team its ids fall under the
  # wildcard profile, so it needs no App IDs of its own.
  PinkyLite:
    templates: [AppBase]
    dependencies:
      - target: PinkyActivityLite
    info:
      path: build/gen/AppLite-Info.plist
      properties: *appInfo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PINKY_BUNDLE_ID).lite
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) NO_TUNNEL

  PinkyActivityLite:
    templates: [ActivityBase]
    info:
      path: build/gen/ActivityLite-Info.plist
      properties: *activityInfo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PINKY_BUNDLE_ID).lite.activity
